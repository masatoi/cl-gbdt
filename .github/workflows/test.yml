name: tests

# Split from lint.yml so the two report separately: a GitHub Actions badge is
# per workflow file, not per job, so "tests" and "lint" cannot be distinguished
# in the README while they share one workflow.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The matrix is the point of this workflow. The bindings are generated on one
    # machine and committed, so "they work on the machine that generated them"
    # proves very little; running them on a second architecture and a second
    # operating system is what turns that into evidence. macOS in particular is
    # the first real exercise of the .dylib discovery path -- until this workflow
    # existed it was correct by construction and by nothing else.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: linux-x86_64}
          - {os: ubuntu-24.04-arm, name: linux-aarch64}
          - {os: macos-latest, name: macos-aarch64}

    steps:
      - uses: actions/checkout@v4

      - name: Install Roswell
        run: |
          curl -fsSL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Report the Lisp this runner resolved
        run: |
          ros run -- --non-interactive --eval '
            (format t "~&~A ~A / ~A ~A~%"
                    (lisp-implementation-type) (lisp-implementation-version)
                    (machine-type) (software-type))'

      - name: Make the checkout visible to ASDF
        # The suites load cl-gbdt by name, so the checkout has to be somewhere ASDF
        # looks. This mirrors how the project is set up for development.
        run: |
          mkdir -p ~/.roswell/local-projects
          ln -sfn "$GITHUB_WORKSPACE" ~/.roswell/local-projects/cl-gbdt

      - name: Install a current ASDF
        # Roswell ships ASDF 3.3.1, whose package-inferred-system dependency scanner
        # does not know the :local-nicknames clause -- src/regen/emit.lisp uses one, and
        # loading any system that reaches it dies with ":LOCAL-NICKNAMES fell through
        # ECASE expression". This is a requirement of the package-inferred-system
        # conversion: before it, that clause was never parsed for dependency inference.
        run: ros install asdf

      - name: Layer 1 - runs with no external artifact
        env:
          CL_GBDT_TEST_SYSTEM: cl-gbdt/tests
        run: ros run -- --non-interactive --load tools/ci/run-tests.lisp

      - name: Install the OpenMP runtime (macOS only)
        # The macOS wheels link against @rpath/libomp.dylib and, unlike the manylinux
        # ones, do not vendor it -- the first run of this workflow failed with
        # "Library not loaded: @rpath/libomp.dylib". Homebrew supplies it.
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Fetch the backend shared libraries
        run: ./tools/fetch-libs.sh

      - name: Layer 2 - the real LightGBM and XGBoost
        env:
          CL_GBDT_TEST_SYSTEM: cl-gbdt/tests/functional
        run: ros run -- --non-interactive --load tools/ci/run-tests.lisp

  version-matrix:
    # Task 4: turns src/version.lisp's recorded compatible-version range from a claim
    # inferred by comparing C headers (tools/check-upstream.lisp) into one actually
    # measured by running layer 2 against real, older/newer libraries -- see
    # README.markdown's "Where the two backends genuinely differ" section for the
    # results and src/version.lisp's *lightgbm-version-range*/*xgboost-version-range*
    # docstrings for the full account.
    #
    # Endpoints of the recorded range only, not every release in between -- the pinned
    # versions (4.7.0/3.3.0) are already exercised by the `test' job above, so this adds
    # exactly the two ends: LightGBM's lowest installable version and XGBoost's lowest
    # verified-compatible one.
    #
    # XGBoost 1.7.0 -- the original inferred lower bound, which local measurement showed
    # is ABI-compatible but behaviourally broken (`rank:pairwise' ties within a group) --
    # was run here as a deliberately-red job, so that the losing case was not quietly
    # removed. That did not survive contact with CI: the leg failed in `Fetch the backend
    # shared libraries', never reaching the test, because that wheel does not install on
    # the runner. A job that fails before it can demonstrate anything teaches nothing, and
    # it cost roughly six minutes and enough contention to get sibling jobs cancelled.
    #
    # The evidence for narrowing the range to 2.0.0 is the local run, recorded in
    # src/version.lisp's docstring and this branch's task report -- not a red CI job. Kept
    # out of the matrix for that reason, not because it contradicted the wide range.
    #
    # Layer 1 only -- it needs no shared library and reruns nothing new when the
    # library version changes, so it is not repeated here.
    #
    # One platform only, Linux x86_64, not all three the `test' job above covers: that
    # job's three platforms exist to catch platform-specific bugs (byte order, calling
    # convention, .dylib vs .so discovery) in bindings generated once and committed. A
    # library *version* difference is a property of the upstream C source, identical on
    # every platform cl-gbdt runs on, so crossing this axis with all three platforms
    # would triple this job's cost for no new information.
    #
    # The two libraries are independent shared objects with no interaction between
    # them, so each one's own endpoint is tested against the *other* library's pinned
    # version, not against the other's endpoints too -- a full cross product would cost
    # more for a combination this project has no reason to think behaves differently
    # from either axis tested alone.
    name: version-matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.expected-to-fail || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lightgbm-4.0.0
            lightgbm_version: '4.0.0'
            xgboost_version: '3.3.0'
          - name: xgboost-2.0.0
            lightgbm_version: '4.7.0'
            xgboost_version: '2.0.0'

    steps:
      - uses: actions/checkout@v4

      - name: Install Roswell
        run: |
          curl -fsSL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Make the checkout visible to ASDF
        run: |
          mkdir -p ~/.roswell/local-projects
          ln -sfn "$GITHUB_WORKSPACE" ~/.roswell/local-projects/cl-gbdt

      - name: Install a current ASDF
        run: ros install asdf

      - name: Fetch the backend shared libraries
        env:
          LIGHTGBM_VERSION: ${{ matrix.lightgbm_version }}
          XGBOOST_VERSION: ${{ matrix.xgboost_version }}
        run: ./tools/fetch-libs.sh

      - name: Layer 2 - functional suite against this version combination
        env:
          CL_GBDT_TEST_SYSTEM: cl-gbdt/tests/functional
        run: ros run -- --non-interactive --load tools/ci/run-tests.lisp
