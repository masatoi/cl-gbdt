name: lint

# Split from test.yml so the two report separately: a GitHub Actions badge is
# per workflow file, not per job, so "tests" and "lint" cannot be distinguished
# in the README while they share one workflow.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # One architecture is enough: nothing these checks look at varies by machine.
    name: static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Roswell
        run: |
          curl -fsSL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Make the checkout visible to ASDF
        run: |
          mkdir -p ~/.roswell/local-projects
          ln -sfn "$GITHUB_WORKSPACE" ~/.roswell/local-projects/cl-gbdt

      - name: Install a current ASDF
        # Roswell ships ASDF 3.3.1, whose uiop:define-package predates
        # :local-nicknames; trivial-glob below will not load without a newer one.
        run: ros install asdf

      - name: Install mallet
        # mallet is not in the Quicklisp dist, so it is cloned into the local-projects
        # tree where ASDF looks. Both are pinned by commit: an unpinned linter turns CI
        # red on someone else's release, which is a bad reason for a build to fail.
        # These are the exact revisions tools/ci/lint.lisp was developed against.
        # Note the mallet pin is a commit, not the 0.9.2 tag -- mallet:lint-files, the
        # programmatic entry point the script uses, postdates that release.
        env:
          MALLET_REF: '25c13e8596e472197cba81d3f08bf825b5ddc03a'
          TRIVIAL_GLOB_REF: '0c2675d9452ed164970f2fc4a0e41784ebee819a'
        run: |
          projects=~/.roswell/local-projects/fukamachi
          mkdir -p "$projects"
          for repo in trivial-glob mallet; do
            git clone --quiet "https://github.com/fukamachi/$repo" "$projects/$repo"
          done
          git -C "$projects/trivial-glob" checkout --quiet "$TRIVIAL_GLOB_REF"
          git -C "$projects/mallet" checkout --quiet "$MALLET_REF"

      - name: Lint and column width
        # mallet does not check line length -- a 132-column file passes it -- so the
        # script checks both. See tools/ci/lint.lisp.
        run: ros run -- --non-interactive --load tools/ci/lint.lisp

      - name: Every leaf system loads on its own
        # package-inferred-system infers dependencies from defpackage clauses only, so a
        # file that references a package it does not declare works right up until load
        # order shifts. Each leaf is loaded in its own fresh image to catch that.
        run: ros run -- --non-interactive --load tools/ci/check-leaf-systems.lisp

      - name: Every source file is reachable from a declared system
        # src/all.lisp's package list is hand-maintained, and a file whose package nobody
        # lists is never compiled, never loaded, and never asserted on -- the silent failure
        # that file's own header describes. This walks every defsystem in cl-gbdt.asd and
        # fails on any .lisp under src/ or tests/ that no closure reaches.
        run: ros run -- --non-interactive --load tools/ci/check-source-reachability.lisp

      - name: Layer 1 does not depend on Layer 2
        # cl-gbdt/lightgbm and cl-gbdt/xgboost are meant to be usable without the unified
        # API. Nothing but this check stops a later :import-from from quietly undoing that:
        # the systems would keep loading and every test would stay green, so the only
        # symptom is a claim in cl-gbdt.asd and both all.lisp headers becoming false. See
        # tools/ci/check-layer-separation.lisp's header for what it reads and what it
        # cannot see.
        run: ros run -- --non-interactive --load tools/ci/check-layer-separation.lisp

      - name: Every Layer 1 entry point checks the class it was handed
        # Each of those entry points was a defmethod specialized on a concrete class before
        # the Layer 1 split turned it into a plain defun, and THAT SPECIALIZER WAS THE TYPE
        # CHECK -- so the conversion drops it with no diff to show for it: same body, same
        # green tests, and the argument's class never asked about again. Review found two
        # consequences, a measured SB-SYS:MEMORY-FAULT-ERROR in one and a silent return in
        # another; see tools/ci/check-layer-1-guards.lisp's header for both, for how a guard
        # is recognised without a list of checker names, and for WHAT THIS CANNOT CATCH.
        run: ros run -- --non-interactive --load tools/ci/check-layer-1-guards.lisp

      - name: Every backend defmethod is float-trap masked
        # A source-level scan, not a dynamic one -- see tools/ci/check-float-traps.lisp's
        # own header for exactly what it catches and what it cannot. SBCL enables FP traps
        # by default on x86-64, not on aarch64 (this runner is x86-64, but the check does
        # not depend on that: it is a text scan either way).
        run: ros run -- --non-interactive --load tools/ci/check-float-traps.lisp

      - name: No backend imports an ABI-blacklisted or undeclared function
        # Two checks in one script, sharing one backend-import parser rather than each
        # deriving it separately -- see tools/ci/check-abi-blacklist.lisp's header for why.
        # ffi-spec/ABI-BLACKLIST.md's own opening line is "the only defence is to never
        # call them" (CHECK A); every backend import must also be declared in that
        # backend's *required-symbols*, so probe-foreign-symbols actually checks it at
        # open-backend instead of a caller finding out at the call site (CHECK B). See the
        # script's header for the empty-parse guard that keeps a passing run meaning
        # "checked and clean," and for both checks' "WHAT THIS CANNOT CATCH."
        run: ros run -- --non-interactive --load tools/ci/check-abi-blacklist.lisp

      - name: Every generated binding is wrapped, planned, or excluded
        # ffi-spec/BINDING-COVERAGE.md classifies all 177 functions src/*/c-api.lisp
        # generate; this fails the build the moment a regenerated binding arrives with no
        # recorded position. See tools/ci/check-binding-coverage.lisp's header for its four
        # checks, its two floors, and its empty-parse guard.
        run: ros run -- --non-interactive --load tools/ci/check-binding-coverage.lisp

      - name: API reference matches the docstrings
        # docs/API-REFERENCE.md is generated from the docstrings cl-gbdt, cl-gbdt/lightgbm
        # and cl-gbdt/xgboost export; this fails the build the moment it drifts from a
        # fresh regeneration -- byte-for-byte, a documentation floor, and a per-package
        # surface floor, in that order. See tools/ci/check-api-reference.lisp's header for
        # all four stages and for WHAT THIS CANNOT CATCH. Not a rove test: it needs both
        # backends' unified systems loaded in one image to see the whole published
        # surface, which cl-gbdt/tests deliberately never has.
        run: ros run -- --non-interactive --load tools/ci/check-api-reference.lisp

      - name: Every published symbol has a position against the functional suite
        # docs/FUNCTIONAL-COVERAGE.md classifies each symbol cl-gbdt, cl-gbdt/lightgbm and
        # cl-gbdt/xgboost export as covered (named by tests/functional/*.lisp's own sources),
        # unproven, or exempt; this fails the build the moment a published symbol has neither a
        # functional test naming it nor a row saying why not. Not a rove test, for the same
        # reason as the step above: it loads both backends' unified systems AND the functional
        # test system into one image to see the whole published surface and the whole suite's
        # references at once, which cl-gbdt/tests deliberately never has. See
        # tools/ci/check-functional-coverage.lisp's header for what COVERED does and does not
        # mean: a floor constant for the covered count, and a ceiling constant -- the one
        # that actually ratchets -- for the unproven count.
        run: ros run -- --non-interactive --load tools/ci/check-functional-coverage.lisp

      - name: Check documentation links
        # README.markdown, CONTRIBUTING.md, CLAUDE.md, THIRD-PARTY-LICENSES.md, both
        # ffi-spec/*.md, the layered-API policy document and all six docs/user-guide/*.md
        # guides had no link checker until now, which is how README.markdown drifted to
        # 239 KB carrying a link into a file the repository does not track. This fails the
        # build on a relative link whose target file does not exist, or whose #fragment
        # derives from no heading in it -- see tools/ci/check-doc-links.lisp's header for
        # the exact GitHub anchor rule (verified against a real rendered page, not merely
        # trusted as written), why docs/API-REFERENCE.md is excluded, and why every link
        # occurrence is checked on its own rather than deduplicated.
        run: ros run -- --non-interactive --load tools/ci/check-doc-links.lisp

      - name: Check the README's support matrix against CI
        # README.markdown's "Supported environments" table names, per backend, the
        # library versions CI actually verifies; this fails the build the moment that
        # column and the union of ffi-spec/VERSIONS plus test.yml's version-matrix job
        # disagree, in either direction. See tools/ci/check-support-matrix.lisp's header
        # for why the table's "Also measured" column is deliberately never checked.
        run: ros run -- --non-interactive --load tools/ci/check-support-matrix.lisp

      - name: Compile every system without warnings
        # All nine systems, not just the three non-test ones: cl-gbdt/regen and the two
        # test systems went unchecked before, which is how tests/functional/lightgbm.lisp
        # carried ignored-variable style warnings nobody noticed -- see this file's
        # commit history and CLAUDE.md's testing notes for the fix.
        #
        # cl-gbdt/lightgbm/unified and cl-gbdt/xgboost/unified are named explicitly even
        # though nothing goes uncompiled without them today: cl-gbdt/tests/functional
        # pulls both in transitively. This list is meant to enumerate the project's public
        # systems, and a reader checking whether one is covered should not have to work out
        # that it is covered by accident -- an accident a change to the functional suite's
        # dependencies could end at any time. cl-gbdt/docgen is named explicitly for the same
        # reason as cl-gbdt/regen, its direct model: both are development-only, and both are
        # reached today only as a transitive dependency of cl-gbdt/tests, which is exactly
        # the accident this list exists to not depend on.
        run: |
          ros run -- --non-interactive \
            --eval '(ql:quickload (list "cl-gbdt" "cl-gbdt/lightgbm" "cl-gbdt/xgboost"
                                         "cl-gbdt/lightgbm/unified"
                                         "cl-gbdt/xgboost/unified"
                                         "cl-gbdt/regen" "cl-gbdt/docgen" "cl-gbdt/tests"
                                         "cl-gbdt/tests/functional") :silent t)' \
            --eval '(dolist (s (list "cl-gbdt" "cl-gbdt/lightgbm" "cl-gbdt/xgboost"
                                      "cl-gbdt/lightgbm/unified"
                                      "cl-gbdt/xgboost/unified"
                                      "cl-gbdt/regen" "cl-gbdt/docgen" "cl-gbdt/tests"
                                      "cl-gbdt/tests/functional"))
                      (asdf:compile-system s :force t))' 2>&1 | tee /tmp/compile.log
          if grep -iE 'caught .*(WARNING|ERROR)' /tmp/compile.log; then
            echo "::error::compilation emitted warnings"
            exit 1
          fi
          echo "no compiler warnings"
